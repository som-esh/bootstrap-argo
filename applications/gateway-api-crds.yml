apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway-api-crds
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/som-esh/bootstrap-argo
    targetRevision: master
    path: infrastructure/gateway-api/crds

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd

  syncPolicy:
    automated:
      prune: false
      selfHeal: true